name: Temporary documentation map sync

on:
  push:
    branches:
      - docs/sync-root-documentation-map

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sync README documentation map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          old_tree = '''docs/
          ├── architecture.md
          ├── interview-guide.md
          └── registration-contract-smoke.md'''

          new_tree = '''docs/
          ├── README.md
          ├── architecture.md
          ├── ci-incident-runbook.md
          ├── interview-guide.md
          ├── quality-gates.md
          ├── registration-contract-smoke.md
          └── test-strategy.md'''

          old_docs = '''- [CONTRIBUTING.md](CONTRIBUTING.md) — workflow разработки;
          - [CODEX.md](CODEX.md) — правила построения автотестов;
          - [REVIEW.md](REVIEW.md) — review checklist;
          - [docs/architecture.md](docs/architecture.md) — архитектура, CI, reporting и non-functional QA;
          - [docs/interview-guide.md](docs/interview-guide.md) — готовые объяснения решений для собеседования;
          - [docs/registration-contract-smoke.md](docs/registration-contract-smoke.md) — manual-only проверка registration HTTP contract.'''

          new_docs = '''- [CONTRIBUTING.md](CONTRIBUTING.md) — workflow разработки;
          - [CODEX.md](CODEX.md) — правила построения автотестов;
          - [REVIEW.md](REVIEW.md) — review checklist;
          - [docs/README.md](docs/README.md) — карта инженерной документации и рекомендуемый порядок чтения;
          - [docs/test-strategy.md](docs/test-strategy.md) — risk-based test strategy, ownership boundaries и quality metrics;
          - [docs/quality-gates.md](docs/quality-gates.md) — merge-blocking signals, diagnostics и evidence expectations;
          - [docs/architecture.md](docs/architecture.md) — архитектура, CI, reporting и non-functional QA;
          - [docs/ci-incident-runbook.md](docs/ci-incident-runbook.md) — signal ownership, severity и evidence-preserving triage;
          - [docs/interview-guide.md](docs/interview-guide.md) — готовые объяснения решений для собеседования;
          - [docs/registration-contract-smoke.md](docs/registration-contract-smoke.md) — manual-only проверка registration HTTP contract.'''

          if text.count(old_tree) != 1:
              raise SystemExit(f'Expected exactly one docs tree block, found {text.count(old_tree)}')
          if text.count(old_docs) != 1:
              raise SystemExit(f'Expected exactly one documentation list block, found {text.count(old_docs)}')

          text = text.replace(old_tree, new_tree)
          text = text.replace(old_docs, new_docs)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit final diff
        shell: bash
        run: |
          rm .github/workflows/tmp-doc-map-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/tmp-doc-map-sync.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "docs: sync root documentation map"
          git push
