name: AI Review

on:
  workflow_run:
    workflows: ["Playwright QA Automation CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR with Gemini
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      # Privileged workflow: secrets and write token are available here.
      # Never checkout the PR head, install PR dependencies, execute PR code,
      # or download artifacts produced by the untrusted PR workflow.
      - name: Checkout trusted reviewer from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Review Pull Request diff
        run: node scripts/ai-review.mjs
        env:
          AI_REVIEW_ALLOW_PUBLISH: "true"
          AI_REVIEW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          AI_REVIEW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
