name: AI Review
run-name: "AI Review • ${{ github.event_name == 'workflow_dispatch' && format('PR #{0}', inputs.pr_number) || github.event.workflow_run.pull_requests[0].number && format('PR #{0}', github.event.workflow_run.pull_requests[0].number) || 'non-PR CI' }} • ${{ github.actor }}"

on:
  workflow_run:
    workflows: ["Playwright QA Automation CI"]
    types: [completed]
    branches-ignore: [main]

  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull Request number to review manually
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-review-${{ inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR with Gemini
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.pull_requests[0] != null
      )
    runs-on: ubuntu-latest
    timeout-minutes: 7

    permissions:
      contents: read
      pull-requests: write

    outputs:
      pr_number: ${{ steps.target.outputs.pr_number }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      review_state: ${{ steps.review.outputs.review_state }}
      findings_total: ${{ steps.review.outputs.findings_total }}
      p1_count: ${{ steps.review.outputs.p1_count }}
      p2_count: ${{ steps.review.outputs.p2_count }}
      p3_count: ${{ steps.review.outputs.p3_count }}
      review_url: ${{ steps.review.outputs.review_url }}
      diff_chars: ${{ steps.review.outputs.diff_chars }}
      reviewed_files: ${{ steps.review.outputs.reviewed_files }}
      model: ${{ steps.review.outputs.model }}
      tokens_total: ${{ steps.review.outputs.tokens_total }}

    steps:
      # Privileged workflow: secrets and write token are available here.
      # Never checkout the PR head, install PR dependencies, execute PR code,
      # or download artifacts produced by the untrusted PR workflow.
      - name: Checkout trusted reviewer from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Resolve review target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
            HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
            HEAD_SHA="$EVENT_HEAD_SHA"
          fi

          if [[ -z "$PR_NUMBER" || -z "$HEAD_SHA" ]]; then
            echo "Could not resolve PR number or head SHA." >&2
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Review Pull Request diff
        id: review
        run: node scripts/ai-review.mjs
        env:
          AI_REVIEW_ALLOW_PUBLISH: "true"
          AI_REVIEW_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          AI_REVIEW_PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}


  notify:
    name: Telegram Notification
    if: ${{ always() && needs.review.result != 'skipped' }}
    needs: [review]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Send AI Review result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REVIEW_JOB_RESULT: ${{ needs.review.result }}
          REVIEW_STATE: ${{ needs.review.outputs.review_state }}
          PR_NUMBER: ${{ needs.review.outputs.pr_number }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          FINDINGS_TOTAL: ${{ needs.review.outputs.findings_total }}
          P1_COUNT: ${{ needs.review.outputs.p1_count }}
          P2_COUNT: ${{ needs.review.outputs.p2_count }}
          P3_COUNT: ${{ needs.review.outputs.p3_count }}
          REVIEW_URL: ${{ needs.review.outputs.review_url }}
          DIFF_CHARS: ${{ needs.review.outputs.diff_chars }}
          REVIEWED_FILES: ${{ needs.review.outputs.reviewed_files }}
          MODEL: ${{ needs.review.outputs.model }}
          TOKENS_TOTAL: ${{ needs.review.outputs.tokens_total }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets не настроены; AI Review notification пропущено."
            exit 0
          fi

          case "$REVIEW_JOB_RESULT" in
            success) RESULT="✅ Успешно" ;;
            failure) RESULT="❌ Ошибка" ;;
            cancelled) RESULT="⏹️ Отменено" ;;
            skipped) RESULT="⏭️ Пропущено" ;;
            *) RESULT="⚠️ ${REVIEW_JOB_RESULT:-неизвестно}" ;;
          esac

          case "$REVIEW_STATE" in
            published) STATE="Review опубликован" ;;
            already_reviewed) STATE="Commit уже проверен" ;;
            scope_clean) STATE="Изменений в scope нет" ;;
            stale) STATE="Результат устарел и не опубликован" ;;
            skipped) STATE="Review пропущен" ;;
            failed) STATE="Review завершился ошибкой" ;;
            dry_run) STATE="Dry run" ;;
            *) STATE="${REVIEW_STATE:-нет данных}" ;;
          esac

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ -n "$PR_NUMBER" ]]; then
            PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
            PR_LINE="<a href=\"${PR_URL}\">PR #${PR_NUMBER}</a>"
          else
            PR_LINE="PR не определён"
          fi

          REVIEW_LINE=""
          if [[ -n "$REVIEW_URL" ]]; then
            REVIEW_LINE="<a href=\"${REVIEW_URL}\">Открыть опубликованный review</a>"
          fi

          MESSAGE=$(cat <<EOF
          <b>PomidorQA • AI Review</b>

          <b>${RESULT}</b>
          ${PR_LINE}
          Commit: <code>${HEAD_SHA:0:7}</code>
          Состояние: <b>${STATE}</b>

          <b>Результат проверки</b>
          Замечания: <b>${FINDINGS_TOTAL:-0}</b>
          P1 / P2 / P3: <b>${P1_COUNT:-0} / ${P2_COUNT:-0} / ${P3_COUNT:-0}</b>

          <b>Область</b>
          Файлов: ${REVIEWED_FILES:-0}
          Diff: ${DIFF_CHARS:-0} символов
          Модель: <code>${MODEL:-неизвестно}</code>
          Токены: ${TOKENS_TOTAL:-0}

          ${REVIEW_LINE}
          <a href="${RUN_URL}">Открыть AI Review в GitHub Actions</a>
          EOF
          )

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --retry 2 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 20 \
              --output /tmp/telegram-ai-review.json \
              --write-out '%{http_code}' \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              || true
          )"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::warning::Telegram не подтвердил доставку AI Review notification (HTTP ${HTTP_CODE:-transport-error})."
            exit 0
          fi

          echo "AI Review result отправлен в Telegram."
