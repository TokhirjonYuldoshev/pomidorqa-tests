name: Visual Regression

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/visual.yml"
      - "playwright.visual.config.ts"
      - "tests/visual/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/visual.yml"
      - "playwright.visual.config.ts"
      - "tests/visual/**"
  schedule:
    - cron: "30 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  visual:
    name: Visual / Chromium baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright_version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: browser_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright_version.outputs.version }}-chromium

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium on cache miss
        if: steps.browser_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Restore visual baseline
        id: visual_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .visual-snapshots
          key: visual-baseline-${{ steps.playwright_version.outputs.version }}-v1

      - name: Bootstrap visual baseline
        if: steps.visual_cache.outputs.cache-hit != 'true'
        run: npx playwright test --config=playwright.visual.config.ts --update-snapshots
        env:
          CI: true
          POMIDORQA_BASE_URL: https://aiqa.su

      - name: Compare against visual baseline
        if: steps.visual_cache.outputs.cache-hit == 'true'
        run: npx playwright test --config=playwright.visual.config.ts
        env:
          CI: true
          POMIDORQA_BASE_URL: https://aiqa.su

      - name: Publish visual summary
        if: ${{ !cancelled() }}
        run: |
          if [[ "${{ steps.visual_cache.outputs.cache-hit }}" == "true" ]]; then
            MODE="comparison"
            DETAILS="Current screenshots were compared with the cached baseline."
          else
            MODE="baseline bootstrap"
            DETAILS="No compatible baseline existed, so this run generated one. The next run with the same Playwright version will compare against it."
          fi

          {
            echo "## 🖼️ Visual Regression"
            echo
            echo "Mode: **${MODE}**"
            echo
            echo "${DETAILS}"
            echo
            echo "Pages: login, register"
            echo "Browser: Chromium"
            echo "Tolerance: maxDiffPixelRatio = 0.01"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload visual baseline/current snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-snapshots-${{ github.run_id }}
          path: .visual-snapshots/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload visual failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-diff-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
