name: Visual Regression
run-name: "Visual Regression • ${{ github.head_ref || github.ref_name }} • ${{ github.actor }}"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/visual.yml"
      - "playwright.visual.config.ts"
      - "tests/visual/**"

  push:
    branches: [main]
    paths:
      - ".github/workflows/visual.yml"
      - "playwright.visual.config.ts"
      - "tests/visual/**"

  schedule:
    - cron: "30 3 * * 4"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  visual:
    name: Visual / Chromium baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright_version
        run: |
          PLAYWRIGHT_VERSION="$(
            node -p "require('@playwright/test/package.json').version"
          )"

          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: browser_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright_version.outputs.version }}-chromium

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium on cache miss
        if: steps.browser_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Restore visual baseline
        id: visual_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .visual-snapshots
          key: visual-baseline-${{ steps.playwright_version.outputs.version }}-v1

      - name: Bootstrap visual baseline
        if: steps.visual_cache.outputs.cache-hit != 'true'
        run: >-
          npx playwright test
          --config=playwright.visual.config.ts
          --update-snapshots
        env:
          CI: true
          POMIDORQA_BASE_URL: https://aiqa.su

      - name: Compare against visual baseline
        if: steps.visual_cache.outputs.cache-hit == 'true'
        run: >-
          npx playwright test
          --config=playwright.visual.config.ts
        env:
          CI: true
          POMIDORQA_BASE_URL: https://aiqa.su

      - name: Publish visual summary
        if: ${{ !cancelled() }}
        run: |
          if [[ "${{ steps.visual_cache.outputs.cache-hit }}" == "true" ]]; then
            MODE="comparison"
            DETAILS="Current screenshots were compared with the cached baseline."
          else
            MODE="baseline bootstrap"
            DETAILS="No compatible baseline existed, so this run generated one. The next run with the same Playwright version will compare against it."
          fi

          {
            echo "## 🖼️ Visual Regression"
            echo
            echo "Mode: **${MODE}**"
            echo
            echo "${DETAILS}"
            echo
            echo "Pages: login, register"
            echo "Browser: Chromium"
            echo "Tolerance: maxDiffPixelRatio = 0.01"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload visual baseline/current snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-snapshots-${{ github.run_id }}
          path: .visual-snapshots/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload visual failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-diff-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  notify:
    name: Telegram Notification
    if: ${{ always() }}
    needs:
      - visual
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Visual Regression result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          VISUAL_RESULT: ${{ needs.visual.result }}

        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets не настроены; уведомление пропущено."

            {
              echo "## ✈️ Telegram"
              echo
              echo "ℹ️ Visual Regression notification пропущено: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID недоступны."
              echo
              echo "Для Pull Request из fork GitHub repository secrets намеренно недоступны."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          result_label() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          event_label() {
            case "$1" in
              pull_request) echo "Pull Request" ;;
              push) echo "Push в репозиторий" ;;
              workflow_dispatch) echo "Ручной Visual Regression запуск" ;;
              schedule) echo "Плановая visual-проверка" ;;
              *) echo "$1" ;;
            esac
          }

          escape_html() {
            local text="$1"

            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"

            printf '%s' "$text"
          }

          if [[ "$VISUAL_RESULT" == "success" ]]; then
            OVERALL_ICON="✅"
            OVERALL_TITLE="VISUAL REGRESSION ПРОЙДЕН"
            OVERALL_SUBTITLE="Visual baseline / comparison завершены успешно"

          elif [[ "$VISUAL_RESULT" == "failure" ]]; then
            OVERALL_ICON="❌"
            OVERALL_TITLE="VISUAL REGRESSION ТРЕБУЕТ ВНИМАНИЯ"
            OVERALL_SUBTITLE="Обнаружено отличие screenshots или произошла ошибка visual-проверки"

          elif [[ "$VISUAL_RESULT" == "cancelled" ]]; then
            OVERALL_ICON="⏹️"
            OVERALL_TITLE="VISUAL REGRESSION ОТМЕНЁН"
            OVERALL_SUBTITLE="Выполнение visual-проверки было остановлено"

          else
            OVERALL_ICON="⚠️"
            OVERALL_TITLE="VISUAL REGRESSION НЕ ЗАВЕРШЁН"
            OVERALL_SUBTITLE="Проверка завершилась без полного результата"
          fi

          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          REPOSITORY_HTML="$(escape_html "$GITHUB_REPOSITORY")"
          BRANCH_HTML="$(escape_html "$BRANCH")"
          ACTOR_HTML="$(escape_html "$GITHUB_ACTOR")"
          EVENT_HTML="$(escape_html "$(event_label "$GITHUB_EVENT_NAME")")"

          MESSAGE=$(cat <<EOF
          <b>PomidorQA • Visual Regression</b>
          <i>Playwright screenshot comparison • Chromium</i>

          ━━━━━━━━━━━━━━
          ${OVERALL_ICON} <b>${OVERALL_TITLE}</b>
          <i>${OVERALL_SUBTITLE}</i>
          ━━━━━━━━━━━━━━

          📦 <b>Репозиторий</b>
          <code>${REPOSITORY_HTML}</code>

          🌿 <b>Ветка</b>
          <code>${BRANCH_HTML}</code>

          ⚡ <b>Событие:</b> ${EVENT_HTML}
          👤 <b>Автор:</b> ${ACTOR_HTML}

          🖼️ <b>Visual Regression</b>
          <blockquote>$(result_label "$VISUAL_RESULT")  Visual result
          🌐 Pages: login + register
          🌍 Browser: Chromium
          🎯 maxDiffPixelRatio: 0.01
          📸 Baseline/current snapshots: 30 days
          🔎 Failure diff diagnostics: 14 days</blockquote>

          🔗 <a href="${RUN_URL}"><b>Открыть Visual Regression run в GitHub Actions</b></a>
          <i>Запуск #${GITHUB_RUN_NUMBER}</i>
          EOF
          )

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --retry 2 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 20 \
              --output /tmp/telegram-response.json \
              --write-out '%{http_code}' \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              || true
          )"

          if [[ "$HTTP_CODE" != "200" ]] ||
             ! jq -e '.ok == true' /tmp/telegram-response.json >/dev/null 2>&1; then

            echo "::warning::Telegram не подтвердил доставку Visual Regression notification (HTTP ${HTTP_CODE:-transport-error})."

            {
              echo "## ✈️ Telegram"
              echo
              echo "⚠️ Visual Regression result сохранён, но Telegram не подтвердил доставку."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          {
            echo "## ✈️ Telegram"
            echo
            echo "✅ Visual Regression result отправлен в Telegram."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Telegram visual notification sent."
