name: "Nightly E2E Regression"
run-name: "Nightly E2E Regression • ${{ github.ref_name }} • ${{ github.actor }}"

on:
  schedule:
    # GitHub cron uses UTC: 23:00 UTC = 02:00 local time (UTC+3) next day.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e-regression
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: Nightly / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: Chromium
          - browser: firefox
            label: Firefox
          - browser: webkit
            label: WebKit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Allure reporter with locked Playwright
        run: |
          LOCKED_PLAYWRIGHT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          npm install --no-save --package-lock=false \
            "allure-playwright@3.11.1" \
            "@playwright/test@${LOCKED_PLAYWRIGHT_VERSION}"
          INSTALLED_PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          if [[ "$INSTALLED_PLAYWRIGHT_VERSION" != "$LOCKED_PLAYWRIGHT_VERSION" ]]; then
            echo "::error::Playwright version drift detected: lockfile=$LOCKED_PLAYWRIGHT_VERSION installed=$INSTALLED_PLAYWRIGHT_VERSION"
            exit 1
          fi
          echo "Playwright version verified: $INSTALLED_PLAYWRIGHT_VERSION"

      - name: Resolve Playwright version
        id: playwright_version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: browser_cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright_version.outputs.version }}-${{ matrix.browser }}

      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Install browser on cache miss
        if: steps.browser_cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}

      - name: Run full E2E regression
        run: npm run test:e2e -- --workers=1 --retries=0
        env:
          CI: true
          ALLURE_ENABLED: true
          E2E_BROWSER: ${{ matrix.browser }}

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx --yes allure@3.16.1 generate allure-results --output allure-report

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-allure-${{ matrix.browser }}-${{ github.run_id }}
          path: allure-report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-playwright-${{ matrix.browser }}-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Nightly Summary
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish nightly summary
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ARTIFACTS_URL="${RUN_URL}#artifacts"

          if [[ "$E2E_RESULT" == "success" ]]; then
            STATUS="✅ Nightly regression passed"
          elif [[ "$E2E_RESULT" == "failure" ]]; then
            STATUS="❌ Nightly regression failed"
          elif [[ "$E2E_RESULT" == "cancelled" ]]; then
            STATUS="⏹️ Nightly regression cancelled"
          else
            STATUS="⚠️ Nightly regression incomplete"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Nightly E2E Regression

          ## ${STATUS}

          - Schedule: 0 23 * * * (23:00 UTC = 02:00 local time UTC+3)
          - Browsers: Chromium, Firefox, WebKit
          - Workers: 1 per browser
          - Retries: 0
          - Scope: full E2E suite
          - [Open artifacts](${ARTIFACTS_URL})
          EOF