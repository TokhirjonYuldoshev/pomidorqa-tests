name: "Nightly E2E Regression"
run-name: "Nightly E2E Regression • ${{ github.ref_name }} • ${{ github.actor }}"

on:
  schedule:
    # GitHub cron uses UTC: 23:00 UTC = 02:00 local time (UTC+3) next day.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e-regression
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: Nightly / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: Chromium
          - browser: firefox
            label: Firefox
          - browser: webkit
            label: WebKit

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright_version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: browser_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright_version.outputs.version }}-${{ matrix.browser }}

      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Install browser on cache miss
        if: steps.browser_cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}

      - name: Run full E2E regression
        run: npm run test:e2e -- --workers=1 --retries=0
        env:
          CI: true
          E2E_BROWSER: ${{ matrix.browser }}

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-allure-${{ matrix.browser }}-${{ github.run_id }}
          path: allure-report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-playwright-${{ matrix.browser }}-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-test-results-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Nightly Summary
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish nightly summary
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ARTIFACTS_URL="${RUN_URL}#artifacts"

          if [[ "$E2E_RESULT" == "success" ]]; then
            STATUS="✅ Nightly regression пройдена"
            NOTE="Полная browser matrix завершилась успешно."
          elif [[ "$E2E_RESULT" == "failure" ]]; then
            STATUS="❌ Nightly regression завершилась с ошибкой"
            NOTE="Один или несколько browser jobs требуют разбора."
          elif [[ "$E2E_RESULT" == "cancelled" ]]; then
            STATUS="⏹️ Nightly regression отменена"
            NOTE="Запуск был остановлен до завершения полной матрицы."
          else
            STATUS="⚠️ Nightly regression завершена не полностью"
            NOTE="Проверьте технические статусы browser jobs."
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Nightly E2E Regression
          _Плановая полная регрессия live PomidorQA_

          ## ${STATUS}
          > ${NOTE}

          | Параметр | Значение |
          | --- | --- |
          | Расписание | 23:00 UTC = 02:00 UTC+3 |
          | Browser matrix | Chromium · Firefox · WebKit |
          | Workers | 1 на браузер |
          | Retries | 0 |
          | Scope | полный E2E-suite |
          | Matrix result | ${E2E_RESULT} |

          [▶️ Открыть run](${RUN_URL}) · [📦 Reports и diagnostics](${ARTIFACTS_URL})

          > ✈️ После завершения Nightly итог отправляется в Telegram; notification transport не изменяет результат E2E.
          EOF

  notify:
    name: Nightly / Telegram Notification
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send nightly result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets are not configured; nightly notification skipped."
            exit 0
          fi

          result_label() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          escape_html() {
            local text="$1"
            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"
            printf '%s' "$text"
          }

          case "$E2E_RESULT" in
            success)
              OVERALL_ICON="✅"
              OVERALL_TITLE="NIGHTLY REGRESSION ПРОЙДЕНА"
              OVERALL_SUBTITLE="Chromium, Firefox и WebKit завершили полный E2E-suite"
              ;;
            failure)
              OVERALL_ICON="❌"
              OVERALL_TITLE="NIGHTLY REGRESSION УПАЛА"
              OVERALL_SUBTITLE="Один или несколько browser jobs требуют разбора"
              ;;
            cancelled)
              OVERALL_ICON="⏹️"
              OVERALL_TITLE="NIGHTLY REGRESSION ОТМЕНЕНА"
              OVERALL_SUBTITLE="Browser matrix не была завершена"
              ;;
            *)
              OVERALL_ICON="⚠️"
              OVERALL_TITLE="NIGHTLY REGRESSION НЕПОЛНАЯ"
              OVERALL_SUBTITLE="Проверьте технические статусы запуска"
              ;;
          esac

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REPOSITORY_HTML="$(escape_html "$GITHUB_REPOSITORY")"
          ACTOR_HTML="$(escape_html "$GITHUB_ACTOR")"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          MESSAGE=$(cat <<EOF
          <b>PomidorQA • Nightly E2E Regression</b>
          <i>Плановая полная регрессия live-стенда</i>

          ━━━━━━━━━━━━━━
          ${OVERALL_ICON} <b>${OVERALL_TITLE}</b>
          <i>${OVERALL_SUBTITLE}</i>
          ━━━━━━━━━━━━━━

          📦 <b>Репозиторий</b>
          <code>${REPOSITORY_HTML}</code>

          🌙 <b>Запуск:</b> Nightly / 23:00 UTC
          🔖 <b>Commit:</b> <code>${SHORT_SHA}</code>
          👤 <b>Actor:</b> ${ACTOR_HTML}

          🌐 <b>Browser matrix</b>
          <blockquote>$(result_label "$E2E_RESULT")  Chromium + Firefox + WebKit
          ⚙️ Workers: 1 на браузер
          ♻️ Retries: 0</blockquote>

          📊 <b>Reports:</b> Allure + Playwright HTML
          🔗 <a href="${RUN_URL}"><b>Открыть Nightly run в GitHub Actions</b></a>
          <i>Запуск #${GITHUB_RUN_NUMBER}</i>
          EOF
          )

          if ! curl --silent --show-error --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=HTML" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            > /tmp/telegram-response.json; then
            echo "::warning::Nightly Telegram notification could not be sent. E2E result is not affected."
            exit 0
          fi

          echo "Nightly Telegram notification sent."
