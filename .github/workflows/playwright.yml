name: "Playwright QA Automation CI"
run-name: "Playwright QA Automation CI • ${{ github.head_ref || github.ref_name }} • ${{ github.actor }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality / lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Validate requirement coverage matrix
        run: npm run coverage:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --reporter=line
        env:
          CI: true

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api -- --reporter=line
        env:
          CI: true

  e2e:
    name: E2E / ${{ matrix.label }}
    needs: [quality, unit, api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: Chromium
          - browser: firefox
            label: Firefox
          - browser: webkit
            label: WebKit
    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright_version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: browser_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright_version.outputs.version }}-${{ matrix.browser }}

      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Install browser on cache miss
        if: ${{ steps.browser_cache.outputs.cache-hit != 'true' }}
        run: npx playwright install ${{ matrix.browser }}

      - name: Run E2E tests
        run: npm run test:e2e -- --workers=4 --retries=0
        env:
          CI: true
          E2E_BROWSER: ${{ matrix.browser }}

      - name: Publish test metrics
        if: ${{ !cancelled() }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "### Test metrics / ${{ matrix.label }}"
            echo
            node scripts/test-metrics.mjs test-results/results.json --markdown || true
            echo
            echo "#### Reports"
            echo
            echo "| Отчёт | Где открыть | Retention |"
            echo "| --- | --- | ---: |"
            echo "| Playwright HTML | [Artifacts](${RUN_URL}#artifacts) | 14 days |"
            echo "| Allure | [Artifacts](${RUN_URL}#artifacts) | 14 days |"
            echo "| JSON + JUnit | [Artifacts](${RUN_URL}#artifacts) | 14 days |"
            echo "| Trace / screenshots / video при failure | [Artifacts](${RUN_URL}#artifacts) | 7 days |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JSON and JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: machine-report-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            test-results/results.json
            test-results/results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-report-${{ matrix.browser }}-${{ github.run_id }}
          path: allure-report/
          if-no-files-found: error
          retention-days: 14

      - name: Publish Allure failure link
        if: ${{ failure() }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "### 📊 Allure failure analysis / ${{ matrix.label }}"
            echo "[Open Allure report artifact](${RUN_URL}#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7


  summary:
    name: CI Summary
    if: ${{ always() }}
    needs: [quality, unit, api, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Download browser machine reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: machine-report-*-${{ github.run_id }}
          path: .qa-artifacts/ci-machine-reports
          merge-multiple: false

      - name: Publish executive CI dashboard
        if: ${{ always() }}
        env:
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          API: ${{ needs.api.result }}
          E2E: ${{ needs.e2e.result }}
        run: node scripts/ci-dashboard.mjs .qa-artifacts/ci-machine-reports

  notify:
    name: Telegram Notification
    if: ${{ always() }}
    needs: [quality, unit, api, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send CI result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          API: ${{ needs.api.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets are not configured; notification skipped."
            exit 0
          fi

          result_label() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "❔ $1" ;;
            esac
          }

          event_label() {
            case "$1" in
              pull_request) echo "Pull Request" ;;
              push) echo "Push в репозиторий" ;;
              workflow_dispatch) echo "Ручной запуск" ;;
              *) echo "$1" ;;
            esac
          }

          escape_html() {
            local text="$1"
            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"
            printf '%s' "$text"
          }

          if [[ "$QUALITY" == "failure" || "$UNIT" == "failure" || "$API" == "failure" || "$E2E" == "failure" ]]; then
            OVERALL_ICON="❌"
            OVERALL_TITLE="СБОРКА ЗАВЕРШИЛАСЬ С ОШИБКОЙ"
            OVERALL_SUBTITLE="Одна или несколько проверок не пройдены"
            E2E_LABEL="$(result_label "$E2E")"
          elif [[ "$QUALITY" == "cancelled" || "$UNIT" == "cancelled" || "$API" == "cancelled" || "$E2E" == "cancelled" ]]; then
            OVERALL_ICON="⏹️"
            OVERALL_TITLE="СБОРКА ОТМЕНЕНА"
            OVERALL_SUBTITLE="Выполнение пайплайна было остановлено"
            E2E_LABEL="$(result_label "$E2E")"
          elif [[ "$QUALITY" == "success" && "$UNIT" == "success" && "$API" == "success" && "$E2E" == "success" ]]; then
            OVERALL_ICON="✅"
            OVERALL_TITLE="ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ"
            OVERALL_SUBTITLE="Сборка завершена успешно"
            E2E_LABEL="$(result_label "$E2E")"
          else
            OVERALL_ICON="⚠️"
            OVERALL_TITLE="СБОРКА ЗАВЕРШЕНА НЕ ПОЛНОСТЬЮ"
            OVERALL_SUBTITLE="Часть проверок была пропущена"
            E2E_LABEL="$(result_label "$E2E")"
          fi

          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REPOSITORY_HTML="$(escape_html "$GITHUB_REPOSITORY")"
          BRANCH_HTML="$(escape_html "$BRANCH")"
          ACTOR_HTML="$(escape_html "$GITHUB_ACTOR")"
          EVENT_HTML="$(escape_html "$(event_label "$GITHUB_EVENT_NAME")")"

          MESSAGE=$(cat <<EOF
          <b>Playwright QA Automation CI</b>
          <i>Автоматические проверки проекта</i>

          ━━━━━━━━━━━━━━
          ${OVERALL_ICON} <b>${OVERALL_TITLE}</b>
          <i>${OVERALL_SUBTITLE}</i>
          ━━━━━━━━━━━━━━

          📦 <b>Репозиторий</b>
          <code>${REPOSITORY_HTML}</code>

          🌿 <b>Ветка</b>
          <code>${BRANCH_HTML}</code>

          ⚡ <b>Событие:</b> ${EVENT_HTML}
          👤 <b>Автор:</b> ${ACTOR_HTML}

          📋 <b>Результаты проверок</b>
          <blockquote>$(result_label "$QUALITY")  Линт и типизация
          $(result_label "$UNIT")  Unit tests
          $(result_label "$API")  API tests
          ${E2E_LABEL}  E2E Matrix / Chromium + Firefox + WebKit</blockquote>

          🔗 <a href="${RUN_URL}"><b>Открыть запуск в GitHub Actions</b></a>
          <i>Запуск #${GITHUB_RUN_NUMBER}</i>
          EOF
          )

          if ! curl --silent --show-error --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=HTML" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            > /tmp/telegram-response.json; then
            echo "::warning::Telegram notification could not be sent. CI result is not affected."
            exit 0
          fi

          echo "Telegram notification sent."
