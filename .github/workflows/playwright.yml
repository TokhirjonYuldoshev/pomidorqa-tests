name: "🍅 PomidorQA CI"
run-name: "🍅 PomidorQA CI • ${{ github.head_ref || github.ref_name }} • ${{ github.actor }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality / lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --reporter=line
        env:
          CI: true

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api -- --reporter=line
        env:
          CI: true

  e2e:
    name: E2E / Chromium
    needs: [quality, unit, api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      browser_cache_hit: ${{ steps.browser_cache.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright_version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: browser_cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium browser on cache miss
        if: steps.browser_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --workers=1
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: CI Summary
    if: ${{ always() }}
    needs: [quality, unit, api, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish run summary
        env:
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          API: ${{ needs.api.result }}
          E2E: ${{ needs.e2e.result }}
          CACHE_HIT: ${{ needs.e2e.outputs.browser_cache_hit }}
        run: |
          status_ru() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          event_ru() {
            case "$1" in
              pull_request) echo "Pull Request" ;;
              push) echo "Push в репозиторий" ;;
              workflow_dispatch) echo "Ручной запуск" ;;
              *) echo "$1" ;;
            esac
          }

          cache_ru() {
            case "$1" in
              true) echo "✅ Hit" ;;
              false) echo "⬇️ Miss" ;;
              *) echo "➖ n/a" ;;
            esac
          }

          html_escape() {
            local text="$1"
            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"
            printf '%s' "$text"
          }

          if [[ "$QUALITY" == "success" && "$UNIT" == "success" && "$API" == "success" && "$E2E" == "success" ]]; then
            OVERALL="✅ ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ"
            OVERALL_NOTE="Сборка завершена успешно и готова к слиянию."
          elif [[ "$QUALITY" == "failure" || "$UNIT" == "failure" || "$API" == "failure" || "$E2E" == "failure" ]]; then
            OVERALL="❌ ЕСТЬ ОШИБКИ"
            OVERALL_NOTE="Одна или несколько проверок завершились с ошибкой."
          elif [[ "$QUALITY" == "cancelled" || "$UNIT" == "cancelled" || "$API" == "cancelled" || "$E2E" == "cancelled" ]]; then
            OVERALL="⏹️ ЗАПУСК ОТМЕНЁН"
            OVERALL_NOTE="Выполнение pipeline было остановлено."
          else
            OVERALL="⚠️ ПРОВЕРКИ ЗАВЕРШЕНЫ НЕ ПОЛНОСТЬЮ"
            OVERALL_NOTE="Часть проверок была пропущена."
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ARTIFACTS_URL="${RUN_URL}#artifacts"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          EVENT="$(event_ru "$GITHUB_EVENT_NAME")"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH_HTML="$(html_escape "$BRANCH")"
          EVENT_HTML="$(html_escape "$EVENT")"
          ACTOR_HTML="$(html_escape "$GITHUB_ACTOR")"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🍅 PomidorQA CI Summary
          _Автоматические проверки проекта • нативный GitHub Actions Summary_

          ## ${OVERALL}
          > ${OVERALL_NOTE}

          [▶️ Открыть run](${RUN_URL}) · [📦 Playwright artifacts](${ARTIFACTS_URL}) · [✈️ Telegram-бот](https://t.me/Tokhirjon_QA_Bot)

          ---

          <table>
            <tr>
              <td valign="top" width="50%">
                <h3>📋 1. Проверки качества</h3>
                <table>
                  <thead><tr><th>Проверка</th><th>Статус</th></tr></thead>
                  <tbody>
                    <tr><td>ESLint + TypeScript</td><td>$(status_ru "$QUALITY")</td></tr>
                    <tr><td>Unit tests</td><td>$(status_ru "$UNIT")</td></tr>
                    <tr><td>API tests</td><td>$(status_ru "$API")</td></tr>
                    <tr><td>E2E / Chromium</td><td>$(status_ru "$E2E")</td></tr>
                  </tbody>
                </table>
              </td>
              <td valign="top" width="50%">
                <h3>✈️ 2. Telegram</h3>
                <table>
                  <thead><tr><th>Возможность</th><th>Детали</th></tr></thead>
                  <tbody>
                    <tr><td>🤖 Бот</td><td><a href="https://t.me/Tokhirjon_QA_Bot">@Tokhirjon_QA_Bot</a></td></tr>
                    <tr><td>🔔 Уведомления</td><td>Автоматически после завершения CI</td></tr>
                    <tr><td>📨 Содержимое</td><td>Общий статус + Quality / Unit / API / E2E</td></tr>
                    <tr><td>🌿 Контекст</td><td>Ветка, автор и событие запуска</td></tr>
                    <tr><td>🔗 Переход</td><td><a href="${RUN_URL}">Открыть этот GitHub Actions run</a></td></tr>
                  </tbody>
                </table>
              </td>
            </tr>
            <tr>
              <td valign="top" width="50%">
                <h3>⚙️ 3. Окружение</h3>
                <table>
                  <thead><tr><th>Параметр</th><th>Значение</th></tr></thead>
                  <tbody>
                    <tr><td>Node.js</td><td><strong>24</strong></td></tr>
                    <tr><td>E2E workers</td><td><strong>1</strong> · shared live stand</td></tr>
                    <tr><td>E2E retries</td><td><strong>2</strong></td></tr>
                    <tr><td>Playwright cache</td><td>$(cache_ru "${CACHE_HIT:-}")</td></tr>
                    <tr><td>Browser</td><td>Chromium · Playwright</td></tr>
                    <tr><td>HTML report</td><td><a href="${ARTIFACTS_URL}">Открыть artifacts</a></td></tr>
                  </tbody>
                </table>
              </td>
              <td valign="top" width="50%">
                <h3>🚀 4. Запуск</h3>
                <table>
                  <thead><tr><th>Поле</th><th>Значение</th></tr></thead>
                  <tbody>
                    <tr><td>Репозиторий</td><td><code>${GITHUB_REPOSITORY}</code></td></tr>
                    <tr><td>Ветка</td><td><code>${BRANCH_HTML}</code></td></tr>
                    <tr><td>Событие</td><td>${EVENT_HTML}</td></tr>
                    <tr><td>Автор</td><td><code>${ACTOR_HTML}</code></td></tr>
                    <tr><td>Commit</td><td><code>${SHORT_SHA}</code></td></tr>
                    <tr><td>Run</td><td><a href="${RUN_URL}">#${GITHUB_RUN_NUMBER}</a></td></tr>
                  </tbody>
                </table>
              </td>
            </tr>
          </table>

          > ✈️ **Telegram подключён:** бот получает итог pipeline и прямую ссылку на этот запуск.

          <details>
          <summary><strong>🔎 Технические статусы</strong></summary>

          - Quality: <code>${QUALITY}</code>
          - Unit: <code>${UNIT}</code>
          - API: <code>${API}</code>
          - E2E: <code>${E2E}</code>
          - Browser cache hit: <code>${CACHE_HIT:-n/a}</code>
          </details>

          ---
          _🍅 PomidorQA • Качественный код сегодня — уверенный релиз завтра._
          EOF

  notify:
    name: Telegram Notification
    if: ${{ always() }}
    needs: [quality, unit, api, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send CI result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          API: ${{ needs.api.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets are not configured; notification skipped."
            exit 0
          fi

          result_label() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "❔ $1" ;;
            esac
          }

          event_label() {
            case "$1" in
              pull_request) echo "Pull Request" ;;
              push) echo "Push в репозиторий" ;;
              workflow_dispatch) echo "Ручной запуск" ;;
              *) echo "$1" ;;
            esac
          }

          escape_html() {
            local text="$1"
            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"
            printf '%s' "$text"
          }

          if [[ "$QUALITY" == "failure" || "$UNIT" == "failure" || "$API" == "failure" || "$E2E" == "failure" ]]; then
            OVERALL_ICON="❌"
            OVERALL_TITLE="СБОРКА ЗАВЕРШИЛАСЬ С ОШИБКОЙ"
            OVERALL_SUBTITLE="Одна или несколько проверок не пройдены"
          elif [[ "$QUALITY" == "cancelled" || "$UNIT" == "cancelled" || "$API" == "cancelled" || "$E2E" == "cancelled" ]]; then
            OVERALL_ICON="⏹️"
            OVERALL_TITLE="СБОРКА ОТМЕНЕНА"
            OVERALL_SUBTITLE="Выполнение пайплайна было остановлено"
          elif [[ "$QUALITY" == "success" && "$UNIT" == "success" && "$API" == "success" && "$E2E" == "success" ]]; then
            OVERALL_ICON="✅"
            OVERALL_TITLE="ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ"
            OVERALL_SUBTITLE="Сборка завершена успешно"
          else
            OVERALL_ICON="⚠️"
            OVERALL_TITLE="СБОРКА ЗАВЕРШЕНА НЕ ПОЛНОСТЬЮ"
            OVERALL_SUBTITLE="Часть проверок была пропущена"
          fi

          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REPOSITORY_HTML="$(escape_html "$GITHUB_REPOSITORY")"
          BRANCH_HTML="$(escape_html "$BRANCH")"
          ACTOR_HTML="$(escape_html "$GITHUB_ACTOR")"
          EVENT_HTML="$(escape_html "$(event_label "$GITHUB_EVENT_NAME")")"

          MESSAGE=$(cat <<EOF
          🍅 <b>PomidorQA CI</b>
          <i>Автоматические проверки проекта</i>

          ━━━━━━━━━━━━━━
          ${OVERALL_ICON} <b>${OVERALL_TITLE}</b>
          <i>${OVERALL_SUBTITLE}</i>
          ━━━━━━━━━━━━━━

          📦 <b>Репозиторий</b>
          <code>${REPOSITORY_HTML}</code>

          🌿 <b>Ветка</b>
          <code>${BRANCH_HTML}</code>

          ⚡ <b>Событие:</b> ${EVENT_HTML}
          👤 <b>Автор:</b> ${ACTOR_HTML}

          📋 <b>Результаты проверок</b>
          <blockquote>$(result_label "$QUALITY")  Линт и типизация
          $(result_label "$UNIT")  Unit tests
          $(result_label "$API")  API tests
          $(result_label "$E2E")  E2E / Chromium</blockquote>

          🔗 <a href="${RUN_URL}"><b>Открыть запуск в GitHub Actions</b></a>
          <i>Запуск #${GITHUB_RUN_NUMBER}</i>
          EOF
          )

          if ! curl --silent --show-error --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=HTML" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            > /tmp/telegram-response.json; then
            echo "::warning::Telegram notification could not be sent. CI result is not affected."
            exit 0
          fi

          echo "Telegram notification sent."
