name: "Playwright QA Automation CI"
run-name: "Playwright QA Automation CI • ${{ github.head_ref || github.ref_name }} • ${{ github.actor }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality / lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --reporter=line
        env:
          CI: true

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api -- --reporter=line
        env:
          CI: true

  # Temporary pause: the shared live aiqa.su stand is currently unstable.
  # The full Chromium / Firefox / WebKit matrix remains available via Run workflow.
  e2e:
    name: E2E / ${{ matrix.label }}
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [quality, unit, api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: Chromium
          - browser: firefox
            label: Firefox
          - browser: webkit
            label: WebKit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Allure reporter with locked Playwright
        run: |
          LOCKED_PLAYWRIGHT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          npm install --no-save --package-lock=false \
            "allure-playwright@3.11.1" \
            "@playwright/test@${LOCKED_PLAYWRIGHT_VERSION}"
          INSTALLED_PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          if [[ "$INSTALLED_PLAYWRIGHT_VERSION" != "$LOCKED_PLAYWRIGHT_VERSION" ]]; then
            echo "::error::Playwright version drift detected: lockfile=$LOCKED_PLAYWRIGHT_VERSION installed=$INSTALLED_PLAYWRIGHT_VERSION"
            exit 1
          fi
          echo "Playwright version verified: $INSTALLED_PLAYWRIGHT_VERSION"

      - name: Resolve Playwright version
        id: playwright_version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: browser_cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright_version.outputs.version }}-${{ matrix.browser }}

      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Install browser on cache miss
        if: steps.browser_cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}

      - name: Run E2E tests
        run: npm run test:e2e -- --workers=1 --retries=0
        env:
          CI: true
          ALLURE_ENABLED: true
          E2E_BROWSER: ${{ matrix.browser }}

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx --yes allure@3.16.1 generate allure-results --output allure-report

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ matrix.browser }}-${{ github.run_id }}
          path: allure-report/
          if-no-files-found: error
          retention-days: 14

      - name: Publish Allure failure link
        if: ${{ failure() }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "### 📊 Allure failure analysis / ${{ matrix.label }}"
            echo "[Open Allure report artifact](${RUN_URL}#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: CI Summary
    if: ${{ always() }}
    needs: [quality, unit, api, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish run summary
        env:
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          API: ${{ needs.api.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          status_ru() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏸️ Временно приостановлено" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          event_ru() {
            case "$1" in
              pull_request) echo "Pull Request" ;;
              push) echo "Push в репозиторий" ;;
              workflow_dispatch) echo "Ручной запуск" ;;
              *) echo "$1" ;;
            esac
          }

          html_escape() {
            local text="$1"
            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"
            printf '%s' "$text"
          }

          if [[ "$QUALITY" == "success" && "$UNIT" == "success" && "$API" == "success" && "$E2E" == "success" ]]; then
            OVERALL="✅ ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ"
            OVERALL_NOTE="Сборка завершена успешно, включая ручную browser matrix."
          elif [[ "$QUALITY" == "success" && "$UNIT" == "success" && "$API" == "success" && "$E2E" == "skipped" ]]; then
            OVERALL="✅ БАЗОВЫЕ ПРОВЕРКИ ПРОЙДЕНЫ"
            OVERALL_NOTE="Live E2E matrix временно приостановлена из-за нестабильности общего стенда; её можно запустить вручную через Run workflow."
          elif [[ "$QUALITY" == "failure" || "$UNIT" == "failure" || "$API" == "failure" || "$E2E" == "failure" ]]; then
            OVERALL="❌ ЕСТЬ ОШИБКИ"
            OVERALL_NOTE="Одна или несколько проверок завершились с ошибкой."
          elif [[ "$QUALITY" == "cancelled" || "$UNIT" == "cancelled" || "$API" == "cancelled" || "$E2E" == "cancelled" ]]; then
            OVERALL="⏹️ ЗАПУСК ОТМЕНЁН"
            OVERALL_NOTE="Выполнение pipeline было остановлено."
          else
            OVERALL="⚠️ ПРОВЕРКИ ЗАВЕРШЕНЫ НЕ ПОЛНОСТЬЮ"
            OVERALL_NOTE="Часть проверок была пропущена."
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ARTIFACTS_URL="${RUN_URL}#artifacts"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          EVENT="$(event_ru "$GITHUB_EVENT_NAME")"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH_HTML="$(html_escape "$BRANCH")"
          EVENT_HTML="$(html_escape "$EVENT")"
          ACTOR_HTML="$(html_escape "$GITHUB_ACTOR")"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Playwright QA Automation CI Summary
          _Автоматические проверки проекта • нативный GitHub Actions Summary_

          ## ${OVERALL}
          > ${OVERALL_NOTE}

          [▶️ Открыть run](${RUN_URL}) · [📊 Allure reports](${ARTIFACTS_URL}) · [📦 Playwright artifacts](${ARTIFACTS_URL}) · [✈️ Telegram-бот](https://t.me/Tokhirjon_QA_Bot)

          ---

          <table>
            <tr>
              <td valign="top" width="50%">
                <h3>📋 1. Проверки качества</h3>
                <table>
                  <thead><tr><th>Проверка</th><th>Статус</th></tr></thead>
                  <tbody>
                    <tr><td>ESLint + TypeScript</td><td>$(status_ru "$QUALITY")</td></tr>
                    <tr><td>Unit tests</td><td>$(status_ru "$UNIT")</td></tr>
                    <tr><td>API tests</td><td>$(status_ru "$API")</td></tr>
                    <tr><td>E2E Matrix / Chromium + Firefox + WebKit</td><td>$(status_ru "$E2E")</td></tr>
                  </tbody>
                </table>
              </td>
              <td valign="top" width="50%">
                <h3>✈️ 2. Telegram</h3>
                <table>
                  <thead><tr><th>Возможность</th><th>Детали</th></tr></thead>
                  <tbody>
                    <tr><td>🤖 Бот</td><td><a href="https://t.me/Tokhirjon_QA_Bot">@Tokhirjon_QA_Bot</a></td></tr>
                    <tr><td>🔔 Уведомления</td><td>Автоматически после завершения CI</td></tr>
                    <tr><td>📨 Содержимое</td><td>Общий статус + Quality / Unit / API / E2E Matrix</td></tr>
                    <tr><td>🌿 Контекст</td><td>Ветка, автор и событие запуска</td></tr>
                    <tr><td>🔗 Переход</td><td><a href="${RUN_URL}">Открыть этот GitHub Actions run</a></td></tr>
                  </tbody>
                </table>
              </td>
            </tr>
            <tr>
              <td valign="top" width="50%">
                <h3>⚙️ 3. Окружение</h3>
                <table>
                  <thead><tr><th>Параметр</th><th>Значение</th></tr></thead>
                  <tbody>
                    <tr><td>Node.js</td><td><strong>24</strong></td></tr>
                    <tr><td>Live E2E</td><td><strong>Manual only</strong> · temporary pause while shared stand is unstable</td></tr>
                    <tr><td>E2E workers</td><td><strong>1 per browser</strong></td></tr>
                    <tr><td>E2E retries</td><td><strong>0</strong> · failures are not masked</td></tr>
                    <tr><td>Browsers</td><td>Chromium · Firefox · WebKit</td></tr>
                    <tr><td>Allure reports</td><td><a href="${ARTIFACTS_URL}">Открыть artifacts</a></td></tr>
                    <tr><td>HTML reports</td><td><a href="${ARTIFACTS_URL}">Открыть artifacts</a></td></tr>
                  </tbody>
                </table>
              </td>
              <td valign="top" width="50%">
                <h3>🚀 4. Запуск</h3>
                <table>
                  <thead><tr><th>Поле</th><th>Значение</th></tr></thead>
                  <tbody>
                    <tr><td>Репозиторий</td><td><code>${GITHUB_REPOSITORY}</code></td></tr>
                    <tr><td>Ветка</td><td><code>${BRANCH_HTML}</code></td></tr>
                    <tr><td>Событие</td><td>${EVENT_HTML}</td></tr>
                    <tr><td>Автор</td><td><code>${ACTOR_HTML}</code></td></tr>
                    <tr><td>Commit</td><td><code>${SHORT_SHA}</code></td></tr>
                    <tr><td>Run</td><td><a href="${RUN_URL}">#${GITHUB_RUN_NUMBER}</a></td></tr>
                  </tbody>
                </table>
              </td>
            </tr>
          </table>

          > ✈️ **Telegram подключён:** бот получает итог pipeline и прямую ссылку на этот запуск.

          <details>
          <summary><strong>🔎 Технические статусы</strong></summary>

          - Quality: <code>${QUALITY}</code>
          - Unit: <code>${UNIT}</code>
          - API: <code>${API}</code>
          - E2E Matrix: <code>${E2E}</code>
          </details>

          ---
          _Playwright QA Automation • Качественный код сегодня — уверенный релиз завтра._
          EOF

  notify:
    name: Telegram Notification
    if: ${{ always() }}
    needs: [quality, unit, api, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send CI result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          API: ${{ needs.api.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets are not configured; notification skipped."
            exit 0
          fi

          result_label() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏸️ Временно приостановлено" ;;
              *) echo "❔ $1" ;;
            esac
          }

          event_label() {
            case "$1" in
              pull_request) echo "Pull Request" ;;
              push) echo "Push в репозиторий" ;;
              workflow_dispatch) echo "Ручной запуск" ;;
              *) echo "$1" ;;
            esac
          }

          escape_html() {
            local text="$1"
            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"
            printf '%s' "$text"
          }

          if [[ "$QUALITY" == "failure" || "$UNIT" == "failure" || "$API" == "failure" || "$E2E" == "failure" ]]; then
            OVERALL_ICON="❌"
            OVERALL_TITLE="СБОРКА ЗАВЕРШИЛАСЬ С ОШИБКОЙ"
            OVERALL_SUBTITLE="Одна или несколько проверок не пройдены"
          elif [[ "$QUALITY" == "cancelled" || "$UNIT" == "cancelled" || "$API" == "cancelled" || "$E2E" == "cancelled" ]]; then
            OVERALL_ICON="⏹️"
            OVERALL_TITLE="СБОРКА ОТМЕНЕНА"
            OVERALL_SUBTITLE="Выполнение пайплайна было остановлено"
          elif [[ "$QUALITY" == "success" && "$UNIT" == "success" && "$API" == "success" && "$E2E" == "success" ]]; then
            OVERALL_ICON="✅"
            OVERALL_TITLE="ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ"
            OVERALL_SUBTITLE="Сборка завершена успешно"
          elif [[ "$QUALITY" == "success" && "$UNIT" == "success" && "$API" == "success" && "$E2E" == "skipped" ]]; then
            OVERALL_ICON="✅"
            OVERALL_TITLE="БАЗОВЫЕ ПРОВЕРКИ ПРОЙДЕНЫ"
            OVERALL_SUBTITLE="Live E2E matrix временно приостановлена; доступен ручной запуск"
          else
            OVERALL_ICON="⚠️"
            OVERALL_TITLE="СБОРКА ЗАВЕРШЕНА НЕ ПОЛНОСТЬЮ"
            OVERALL_SUBTITLE="Часть проверок была пропущена"
          fi

          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REPOSITORY_HTML="$(escape_html "$GITHUB_REPOSITORY")"
          BRANCH_HTML="$(escape_html "$BRANCH")"
          ACTOR_HTML="$(escape_html "$GITHUB_ACTOR")"
          EVENT_HTML="$(escape_html "$(event_label "$GITHUB_EVENT_NAME")")"

          MESSAGE=$(cat <<EOF
          <b>Playwright QA Automation CI</b>
          <i>Автоматические проверки проекта</i>

          ━━━━━━━━━━━━━━
          ${OVERALL_ICON} <b>${OVERALL_TITLE}</b>
          <i>${OVERALL_SUBTITLE}</i>
          ━━━━━━━━━━━━━━

          📦 <b>Репозиторий</b>
          <code>${REPOSITORY_HTML}</code>

          🌿 <b>Ветка</b>
          <code>${BRANCH_HTML}</code>

          ⚡ <b>Событие:</b> ${EVENT_HTML}
          👤 <b>Автор:</b> ${ACTOR_HTML}

          📋 <b>Результаты проверок</b>
          <blockquote>$(result_label "$QUALITY")  Линт и типизация
          $(result_label "$UNIT")  Unit tests
          $(result_label "$API")  API tests
          $(result_label "$E2E")  E2E Matrix / Chromium + Firefox + WebKit</blockquote>

          🔗 <a href="${RUN_URL}"><b>Открыть запуск в GitHub Actions</b></a>
          <i>Запуск #${GITHUB_RUN_NUMBER}</i>
          EOF
          )

          if ! curl --silent --show-error --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=HTML" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            > /tmp/telegram-response.json; then
            echo "::warning::Telegram notification could not be sent. CI result is not affected."
            exit 0
          fi

          echo "Telegram notification sent."