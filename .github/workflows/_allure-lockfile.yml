name: Temporary Allure Lockfile Generator

on:
  push:
    branches:
      - feat/allure-first-class
    paths:
      - package.json
      - .github/workflows/_allure-lockfile.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  lockfile:
    name: Generate lockfile and verify Allure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/allure-first-class

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Allure reporter with unit tests
        run: npm run test:unit

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Verify generated report
        run: |
          test -d allure-results
          test -d allure-report
          test -f allure-report/index.html

      - name: Commit package lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock Allure dependencies"
          git push origin HEAD:feat/allure-first-class
