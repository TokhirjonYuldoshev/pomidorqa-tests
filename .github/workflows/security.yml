name: "Security & Quality Gates"
run-name: "Security & Quality Gates • ${{ github.head_ref || github.ref_name }} • ${{ github.actor }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  npm-audit:
    name: Security / npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX npm SBOM
        id: sbom
        continue-on-error: true
        run: npm sbom --sbom-format cyclonedx > npm-sbom.cdx.json

      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high --json | tee npm-audit.json

      - name: Publish audit and supply-chain summary
        if: ${{ always() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const auditOutcome = process.env.AUDIT_OUTCOME ?? 'not-run';
          const sbomOutcome = process.env.SBOM_OUTCOME ?? 'not-run';

          if (!fs.existsSync('npm-audit.json')) {
            fs.appendFileSync(summaryPath, `## npm security evidence\n\nAudit JSON was not produced.\n\n- Audit step: **${auditOutcome}**\n- CycloneDX SBOM: **${sbomOutcome}**\n`);
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const total = counts.total ?? 0;
          const lines = [
            '## npm security evidence',
            '',
            '| Severity | Count |',
            '| --- | ---: |',
            `| Critical | ${counts.critical ?? 0} |`,
            `| High | ${counts.high ?? 0} |`,
            `| Moderate | ${counts.moderate ?? 0} |`,
            `| Low | ${counts.low ?? 0} |`,
            `| Info | ${counts.info ?? 0} |`,
            `| **Total** | **${total}** |`,
            '',
            `- Audit step: **${auditOutcome}**`,
            `- CycloneDX SBOM generation: **${sbomOutcome}**`,
            `- Vulnerability evidence: \`npm-audit-${process.env.GITHUB_RUN_ID}\` artifact (14 days)`,
            `- Supply-chain evidence: \`npm-sbom-${process.env.GITHUB_RUN_ID}\` artifact (14 days)`,
            '- Enforcement threshold: **high / critical**. Lower-severity findings remain visible in the evidence instead of being hidden.',
            '',
          ];
          fs.appendFileSync(summaryPath, `${lines.join('\n')}\n`);
          NODE

      - name: Upload npm audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ github.run_id }}
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload npm CycloneDX SBOM evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-sbom-${{ github.run_id }}
          path: npm-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce npm security evidence
        if: ${{ always() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
        run: |
          set -euo pipefail
          if [[ "$AUDIT_OUTCOME" != 'success' ]]; then
            echo "npm audit finished with outcome: $AUDIT_OUTCOME" >&2
            exit 1
          fi
          if [[ "$SBOM_OUTCOME" != 'success' ]]; then
            echo "npm CycloneDX SBOM generation finished with outcome: $SBOM_OUTCOME" >&2
            exit 1
          fi

  dependency-review:
    name: Security / dependency change review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect dependency manifest changes
        id: manifests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- package.json package-lock.json)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json or package-lock.json changes in this pull request."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency files changed:"
            printf '%s\n' "$CHANGED_FILES"
          fi

      - name: Setup Node.js
        if: steps.manifests.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate lockfile consistency
        if: steps.manifests.outputs.changed == 'true'
        run: npm ci

      - name: Audit dependency changes
        if: steps.manifests.outputs.changed == 'true'
        run: npm audit --audit-level=high

  quality:
    name: Security / code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

  summary:
    name: Security Summary
    if: ${{ always() }}
    needs: [npm-audit, dependency-review, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish security summary
        env:
          AUDIT: ${{ needs.npm-audit.result }}
          DEPENDENCIES: ${{ needs.dependency-review.result }}
          QUALITY: ${{ needs.quality.result }}
        run: |
          status_label() {
            case "$1" in
              success) echo "✅ passed" ;;
              failure) echo "❌ failed" ;;
              skipped) echo "⏭️ skipped" ;;
              cancelled) echo "⏹️ cancelled" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Security & Quality Gates

          | Gate | Result |
          | --- | --- |
          | npm audit + CycloneDX SBOM evidence | $(status_label "$AUDIT") |
          | Dependency change review | $(status_label "$DEPENDENCIES") |
          | ESLint + TypeScript | $(status_label "$QUALITY") |
          EOF
