name: "Security & Quality Gates"
run-name: "Security & Quality Gates • ${{ github.head_ref || github.ref_name }} • ${{ github.actor }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  npm-audit:
    name: Security / npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX npm SBOM
        id: sbom
        continue-on-error: true
        run: npm sbom --sbom-format cyclonedx > npm-sbom.cdx.json

      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high --json | tee npm-audit.json

      - name: Publish audit and supply-chain summary
        if: ${{ always() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const auditOutcome = process.env.AUDIT_OUTCOME ?? 'not-run';
          const sbomOutcome = process.env.SBOM_OUTCOME ?? 'not-run';

          if (!fs.existsSync('npm-audit.json')) {
            fs.appendFileSync(
              summaryPath,
              `## npm security evidence\n\nAudit JSON was not produced.\n\n- Audit step: **${auditOutcome}**\n- CycloneDX SBOM: **${sbomOutcome}**\n`,
            );
            process.exit(0);
          }

          const report = JSON.parse(
            fs.readFileSync('npm-audit.json', 'utf8'),
          );

          const counts = report.metadata?.vulnerabilities ?? {};
          const total = counts.total ?? 0;

          const lines = [
            '## npm security evidence',
            '',
            '| Severity | Count |',
            '| --- | ---: |',
            `| Critical | ${counts.critical ?? 0} |`,
            `| High | ${counts.high ?? 0} |`,
            `| Moderate | ${counts.moderate ?? 0} |`,
            `| Low | ${counts.low ?? 0} |`,
            `| Info | ${counts.info ?? 0} |`,
            `| **Total** | **${total}** |`,
            '',
            `- Audit step: **${auditOutcome}**`,
            `- CycloneDX SBOM generation: **${sbomOutcome}**`,
            `- Vulnerability evidence: \`npm-audit-${process.env.GITHUB_RUN_ID}\` artifact (14 days)`,
            `- Supply-chain evidence: \`npm-sbom-${process.env.GITHUB_RUN_ID}\` artifact (14 days)`,
            '- Enforcement threshold: **high / critical**. Lower-severity findings remain visible in the evidence instead of being hidden.',
            '',
          ];

          fs.appendFileSync(
            summaryPath,
            `${lines.join('\n')}\n`,
          );
          NODE

      - name: Upload npm audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit-${{ github.run_id }}
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload npm CycloneDX SBOM evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-sbom-${{ github.run_id }}
          path: npm-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce npm security evidence
        if: ${{ always() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
        run: |
          set -euo pipefail

          if [[ "$AUDIT_OUTCOME" != 'success' ]]; then
            echo "npm audit finished with outcome: $AUDIT_OUTCOME" >&2
            exit 1
          fi

          if [[ "$SBOM_OUTCOME" != 'success' ]]; then
            echo "npm CycloneDX SBOM generation finished with outcome: $SBOM_OUTCOME" >&2
            exit 1
          fi

  dependency-review:
    name: Security / dependency change review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect dependency manifest changes
        id: manifests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_FILES="$(
            git diff \
              --name-only \
              "$BASE_SHA" \
              "$HEAD_SHA" \
              -- package.json package-lock.json
          )"

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json or package-lock.json changes in this pull request."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency files changed:"
            printf '%s\n' "$CHANGED_FILES"
          fi

      - name: Setup Node.js
        if: steps.manifests.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Validate lockfile consistency
        if: steps.manifests.outputs.changed == 'true'
        run: npm ci

      - name: Audit dependency changes
        if: steps.manifests.outputs.changed == 'true'
        run: npm audit --audit-level=high

  quality:
    name: Security / code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

  summary:
    name: Security Summary
    if: ${{ always() }}
    needs:
      - npm-audit
      - dependency-review
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Publish security summary
        env:
          AUDIT: ${{ needs.npm-audit.result }}
          DEPENDENCIES: ${{ needs.dependency-review.result }}
          QUALITY: ${{ needs.quality.result }}
        run: |
          status_label() {
            case "$1" in
              success) echo "✅ passed" ;;
              failure) echo "❌ failed" ;;
              skipped) echo "⏭️ skipped" ;;
              cancelled) echo "⏹️ cancelled" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Security & Quality Gates

          | Gate | Result |
          | --- | --- |
          | npm audit + CycloneDX SBOM evidence | $(status_label "$AUDIT") |
          | Dependency change review | $(status_label "$DEPENDENCIES") |
          | ESLint + TypeScript | $(status_label "$QUALITY") |
          EOF

  notify:
    name: Telegram Notification
    if: ${{ always() }}
    needs:
      - npm-audit
      - dependency-review
      - quality
      - summary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Security result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          AUDIT_RESULT: ${{ needs.npm-audit.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SUMMARY_RESULT: ${{ needs.summary.result }}

        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets не настроены; уведомление пропущено."

            {
              echo "## ✈️ Telegram"
              echo
              echo "ℹ️ Security notification пропущено: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID недоступны."
              echo
              echo "Для Pull Request из fork GitHub repository secrets намеренно недоступны."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          result_label() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          event_label() {
            case "$1" in
              pull_request) echo "Pull Request" ;;
              push) echo "Push в репозиторий" ;;
              workflow_dispatch) echo "Ручной запуск" ;;
              *) echo "$1" ;;
            esac
          }

          escape_html() {
            local text="$1"
            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"
            printf '%s' "$text"
          }

          if [[ "$AUDIT_RESULT" == "failure" ||
                "$DEPENDENCY_RESULT" == "failure" ||
                "$QUALITY_RESULT" == "failure" ]]; then

            OVERALL_ICON="❌"
            OVERALL_TITLE="SECURITY ТРЕБУЕТ ВНИМАНИЯ"
            OVERALL_SUBTITLE="Один или несколько security / quality gates завершились с ошибкой"

          elif [[ "$AUDIT_RESULT" == "cancelled" ||
                  "$DEPENDENCY_RESULT" == "cancelled" ||
                  "$QUALITY_RESULT" == "cancelled" ]]; then

            OVERALL_ICON="⏹️"
            OVERALL_TITLE="SECURITY-ПРОВЕРКА ОТМЕНЕНА"
            OVERALL_SUBTITLE="Выполнение Security & Quality Gates было остановлено"

          elif [[ "$AUDIT_RESULT" == "success" &&
                  "$QUALITY_RESULT" == "success" &&
                  ( "$DEPENDENCY_RESULT" == "success" ||
                    "$DEPENDENCY_RESULT" == "skipped" ) ]]; then

            OVERALL_ICON="✅"
            OVERALL_TITLE="SECURITY & QUALITY GATES ПРОЙДЕНЫ"
            OVERALL_SUBTITLE="Dependencies, SBOM, ESLint и TypeScript проверки подтверждены"

          else

            OVERALL_ICON="⚠️"
            OVERALL_TITLE="SECURITY-ПРОВЕРКА ЗАВЕРШЕНА НЕ ПОЛНОСТЬЮ"
            OVERALL_SUBTITLE="Часть security-сигналов не дала полного результата"

          fi

          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          REPOSITORY_HTML="$(escape_html "$GITHUB_REPOSITORY")"
          BRANCH_HTML="$(escape_html "$BRANCH")"
          ACTOR_HTML="$(escape_html "$GITHUB_ACTOR")"
          EVENT_HTML="$(escape_html "$(event_label "$GITHUB_EVENT_NAME")")"

          MESSAGE=$(cat <<EOF
          <b>PomidorQA • Security &amp; Quality Gates</b>
          <i>Dependency security, SBOM и статический контроль качества</i>

          ━━━━━━━━━━━━━━
          ${OVERALL_ICON} <b>${OVERALL_TITLE}</b>
          <i>${OVERALL_SUBTITLE}</i>
          ━━━━━━━━━━━━━━

          📦 <b>Репозиторий</b>
          <code>${REPOSITORY_HTML}</code>

          🌿 <b>Ветка</b>
          <code>${BRANCH_HTML}</code>

          ⚡ <b>Событие:</b> ${EVENT_HTML}
          👤 <b>Автор:</b> ${ACTOR_HTML}

          🛡️ <b>Результаты проверок</b>
          <blockquote>$(result_label "$AUDIT_RESULT")  npm audit + CycloneDX SBOM
          $(result_label "$DEPENDENCY_RESULT")  Dependency change review
          $(result_label "$QUALITY_RESULT")  ESLint + TypeScript
          $(result_label "$SUMMARY_RESULT")  Security Summary</blockquote>

          🔗 <a href="${RUN_URL}"><b>Открыть Security run в GitHub Actions</b></a>
          <i>Запуск #${GITHUB_RUN_NUMBER}</i>
          EOF
          )

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --retry 2 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 20 \
              --output /tmp/telegram-response.json \
              --write-out '%{http_code}' \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              || true
          )"

          if [[ "$HTTP_CODE" != "200" ]] ||
             ! jq -e '.ok == true' /tmp/telegram-response.json >/dev/null 2>&1; then

            echo "::warning::Telegram не подтвердил доставку Security notification (HTTP ${HTTP_CODE:-transport-error})."

            {
              echo "## ✈️ Telegram"
              echo
              echo "⚠️ Security result сохранён, но Telegram не подтвердил доставку."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          {
            echo "## ✈️ Telegram"
            echo
            echo "✅ Security & Quality Gates result отправлен в Telegram."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Telegram security notification sent."
