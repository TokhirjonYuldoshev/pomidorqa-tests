name: Registration Contract Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: PomidorQA base URL
        required: false
        default: https://aiqa.su
        type: string

permissions:
  contents: read

concurrency:
  group: registration-contract-smoke
  cancel-in-progress: false

jobs:
  registration-contract:
    name: Registration Contract / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run registration contract smoke
        run: node scripts/registration-contract-smoke.mjs
        env:
          POMIDORQA_BASE_URL: ${{ inputs.base_url }}

      - name: Publish contract summary
        if: ${{ always() }}
        run: |
          if [[ ! -f .qa-artifacts/registration-contract/summary.json ]]; then
            echo "## Контракт регистрации" >> "$GITHUB_STEP_SUMMARY"
            echo "Файл результата не создан." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const result = JSON.parse(
            fs.readFileSync('.qa-artifacts/registration-contract/summary.json', 'utf8'),
          );

          const icon = result.status === 'passed' ? '✅' : '❌';
          console.log('## Контракт регистрации');
          console.log('');
          console.log(`${icon} Результат: **${result.status}**`);
          console.log(`- Стенд: \`${result.baseUrl}\``);
          console.log(`- Ожидалось: \`${result.expected.requestMethod} ${result.expected.requestPath} -> ${result.expected.responseStatus}\``);
          console.log(`- Фактический статус: \`${result.actual.responseStatus ?? 'n/a'}\``);
          console.log(`- Итоговый путь: \`${result.actual.finalPath ?? 'n/a'}\``);
          if (result.error) {
            console.log(`- Ошибка: ${result.error}`);
          }
          NODE

      - name: Upload contract artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registration-contract-${{ github.run_id }}
          path: .qa-artifacts/registration-contract/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Send registration contract result to Telegram
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets не настроены; уведомление о контракте регистрации пропущено."
            exit 0
          fi

          RESULT_TEXT="$JOB_STATUS"
          BASE_URL="${{ inputs.base_url }}"
          ACTUAL_STATUS="n/a"
          FINAL_PATH="n/a"

          if [[ -f .qa-artifacts/registration-contract/summary.json ]]; then
            RESULT_TEXT="$(jq -r '.status // "unknown"' .qa-artifacts/registration-contract/summary.json)"
            BASE_URL="$(jq -r '.baseUrl // "'"$BASE_URL"'"' .qa-artifacts/registration-contract/summary.json)"
            ACTUAL_STATUS="$(jq -r '.actual.responseStatus // "n/a"' .qa-artifacts/registration-contract/summary.json)"
            FINAL_PATH="$(jq -r '.actual.finalPath // "n/a"' .qa-artifacts/registration-contract/summary.json)"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          MESSAGE=$(cat <<EOF
          <b>PomidorQA • Контракт регистрации</b>

          Результат: <b>${RESULT_TEXT}</b>
          Стенд: <code>${BASE_URL}</code>
          HTTP: <code>${ACTUAL_STATUS}</code>
          Итоговый путь: <code>${FINAL_PATH}</code>

          <a href="${RUN_URL}">Открыть проверку в GitHub Actions</a>
          EOF
          )

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --retry 2 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 20 \
              --output /tmp/telegram-registration-contract.json \
              --write-out '%{http_code}' \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              || true
          )"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::warning::Telegram не подтвердил доставку Registration Contract notification (HTTP ${HTTP_CODE:-transport-error})."
            exit 0
          fi

          echo "Registration Contract result отправлен в Telegram."
