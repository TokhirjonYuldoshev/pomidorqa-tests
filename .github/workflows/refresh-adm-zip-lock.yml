name: Temporary adm-zip lock refresh

on:
  push:
    branches:
      - security/remediate-adm-zip

permissions:
  contents: write

jobs:
  refresh-lock:
    name: Refresh adm-zip lock resolution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Refresh transitive adm-zip resolution
        run: npm update adm-zip --package-lock-only

      - name: Verify remediated resolution
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const resolved = lock.packages?.['node_modules/adm-zip']?.version;
          console.log(`Resolved adm-zip: ${resolved}`);
          if (!resolved || resolved === '0.6.0') {
            process.exit(1);
          }
          NODE

      - name: Verify scoped dependency diff
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf 'Changed files after npm update:\n%s\n' "$changed"
          test "$changed" = "package-lock.json"

      - name: Validate deterministic install
        run: npm ci

      - name: Validate security threshold
        run: npm audit --audit-level=high

      - name: Commit npm-generated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: resolve adm-zip advisory"
          git push origin "HEAD:${GITHUB_REF_NAME}"
