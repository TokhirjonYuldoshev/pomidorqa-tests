name: "🍅 PomidorQA Visual Dashboard"
run-name: "🍅 Dashboard • ${{ github.event.workflow_run.head_branch || 'main' }} • run #${{ github.event.workflow_run.run_number || github.run_number }}"

on:
  workflow_run:
    workflows: ["🍅 PomidorQA CI"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: visual-dashboard-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Visual CI Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted dashboard generator
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read source CI job results
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          jobs_json="$(curl --silent --show-error --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")"

          job_result() {
            local job_name="$1"
            jq -r --arg name "$job_name" \
              '[.jobs[] | select(.name == $name)][0].conclusion // "unknown"' \
              <<< "$jobs_json"
          }

          echo "quality=$(job_result 'Quality / lint + typecheck')" >> "$GITHUB_OUTPUT"
          echo "unit=$(job_result 'Unit tests')" >> "$GITHUB_OUTPUT"
          echo "api=$(job_result 'API tests')" >> "$GITHUB_OUTPUT"
          echo "e2e=$(job_result 'E2E / Chromium')" >> "$GITHUB_OUTPUT"

          cache_hit="$(jq -r '[.jobs[] | select(.name == "E2E / Chromium")][0].steps[]? | select(.name == "Install Chromium browser on cache miss") | if .conclusion == "skipped" then "true" else "false" end' <<< "$jobs_json" | head -n 1)"
          echo "cache_hit=${cache_hit:-n/a}" >> "$GITHUB_OUTPUT"

      - name: Generate visual dashboard
        env:
          QUALITY: ${{ steps.source.outputs.quality }}
          UNIT: ${{ steps.source.outputs.unit }}
          API: ${{ steps.source.outputs.api }}
          E2E: ${{ steps.source.outputs.e2e }}
          CACHE_HIT: ${{ steps.source.outputs.cache_hit }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_ACTOR: ${{ github.event.workflow_run.actor.login }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          node --input-type=module <<'EOF'
          process.env.GITHUB_REPOSITORY = process.env.SOURCE_REPOSITORY;
          process.env.GITHUB_REF_NAME = process.env.SOURCE_BRANCH;
          process.env.GITHUB_HEAD_REF = process.env.SOURCE_BRANCH;
          process.env.GITHUB_ACTOR = process.env.SOURCE_ACTOR;
          process.env.GITHUB_EVENT_NAME = process.env.SOURCE_EVENT;
          process.env.GITHUB_RUN_NUMBER = process.env.SOURCE_RUN_NUMBER;
          process.env.GITHUB_RUN_ID = process.env.SOURCE_RUN_ID;
          await import("./scripts/generate-ci-dashboard.mjs");
          EOF

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v7
        with:
          name: pomidorqa-ci-dashboard-${{ github.event.workflow_run.id }}
          path: ci-dashboard/
          if-no-files-found: error
          retention-days: 14

      - name: Publish dashboard summary
        env:
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          {
            echo "# 🍅 PomidorQA Visual Dashboard"
            echo
            echo "Динамическая карточка собрана из реальных результатов исходного CI run."
            echo
            echo "- Исходный run: [#${SOURCE_RUN_NUMBER}](${SOURCE_RUN_URL})"
            echo "- Ветка: \`${SOURCE_BRANCH}\`"
            echo "- Итог workflow: \`${SOURCE_CONCLUSION}\`"
            echo
            echo "## 🎨 Dashboard"
            echo
            echo "В artifact **pomidorqa-ci-dashboard-${{ github.event.workflow_run.id }}** находятся:"
            echo "- \`dashboard.svg\` — визуальная карточка 1600×900;"
            echo "- \`index.html\` — полноэкранный HTML-preview."
            echo
            echo "[Открыть artifacts этого запуска](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts)"
            echo
            echo "> Dashboard не влияет на required checks: это отдельный read-only workflow после завершения основного CI."
          } >> "$GITHUB_STEP_SUMMARY"
