name: Playwright Stability Check
run-name: "Playwright Stability Check • ${{ inputs.scenario || 'booking-flow' }} • ${{ github.actor }}"

on:
  schedule:
    - cron: "17 4 * * 0"

  workflow_dispatch:
    inputs:
      scenario:
        description: E2E scenario to stress-test
        required: true
        default: booking-flow
        type: choice
        options:
          - booking-flow
          - all-e2e

      repeat_each:
        description: Number of repetitions
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "10"

      workers:
        description: Number of workers
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  STABILITY_SCENARIO: ${{ inputs.scenario || 'booking-flow' }}
  STABILITY_REPEAT_EACH: ${{ inputs.repeat_each || '5' }}
  STABILITY_WORKERS: ${{ inputs.workers || '1' }}

jobs:
  stability:
    name: E2E stability / ${{ inputs.scenario || 'booking-flow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright_version
        run: |
          PLAYWRIGHT_VERSION="$(
            node -p "require('@playwright/test/package.json').version"
          )"

          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: browser_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium browser on cache miss
        if: steps.browser_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Resolve test target
        id: target
        run: |
          case "$STABILITY_SCENARIO" in
            booking-flow)
              echo "path=tests/e2e/booking-flow.spec.ts" >> "$GITHUB_OUTPUT"
              ;;
            all-e2e)
              echo "path=tests/e2e" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported scenario: $STABILITY_SCENARIO" >&2
              exit 2
              ;;
          esac

      - name: Run stability test without retries
        id: stability_run
        continue-on-error: true
        env:
          CI: true
        run: >-
          npx playwright test
          --project=e2e
          "${{ steps.target.outputs.path }}"
          --repeat-each="$STABILITY_REPEAT_EACH"
          --workers="$STABILITY_WORKERS"
          --retries=0

      - name: Generate Allure report
        if: ${{ always() }}
        run: npm run allure:generate

      - name: Upload stability Allure report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stability-allure-${{ github.run_id }}
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload stability HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stability-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload stability diagnostics
        if: ${{ steps.stability_run.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stability-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish stability summary
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.stability_run.outcome }}
          CACHE_HIT: ${{ steps.browser_cache.outputs.cache-hit }}
        run: |
          if [[ "$OUTCOME" == "success" ]]; then
            RESULT="✅ Стабильно в этом запуске"
          else
            RESULT="❌ Обнаружена ошибка или нестабильность"
          fi

          {
            echo "## 🔁 Playwright Stability Check"
            echo
            echo "- Сценарий: \`$STABILITY_SCENARIO\`"
            echo "- Повторений: \`$STABILITY_REPEAT_EACH\`"
            echo "- Workers: \`$STABILITY_WORKERS\`"
            echo "- Retries: \`0\` — ошибки не маскируются"
            echo "- Browser cache hit: \`${CACHE_HIT:-n/a}\`"
            echo "- Allure report: загружен как workflow artifact"
            echo "- Результат: ${RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow when stability check failed
        if: ${{ steps.stability_run.outcome == 'failure' }}
        run: |
          echo "Stability check detected a failure or flaky behavior." >&2
          exit 1

  notify:
    name: Telegram Notification
    if: ${{ always() }}
    needs:
      - stability
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Stability result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          STABILITY_RESULT: ${{ needs.stability.result }}
          SCENARIO: ${{ inputs.scenario || 'booking-flow' }}
          REPEAT_EACH: ${{ inputs.repeat_each || '5' }}
          WORKERS: ${{ inputs.workers || '1' }}

        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets не настроены; уведомление пропущено."

            {
              echo "## ✈️ Telegram"
              echo
              echo "ℹ️ Stability notification пропущено: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID недоступны."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          result_label() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          event_label() {
            case "$1" in
              workflow_dispatch) echo "Ручной stability-запуск" ;;
              schedule) echo "Плановая stability-проверка" ;;
              *) echo "$1" ;;
            esac
          }

          escape_html() {
            local text="$1"

            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"

            printf '%s' "$text"
          }

          if [[ "$STABILITY_RESULT" == "success" ]]; then
            OVERALL_ICON="✅"
            OVERALL_TITLE="STABILITY CHECK ПРОЙДЕН"
            OVERALL_SUBTITLE="Повторные E2E-прогоны завершились без обнаруженной нестабильности"

          elif [[ "$STABILITY_RESULT" == "failure" ]]; then
            OVERALL_ICON="❌"
            OVERALL_TITLE="ОБНАРУЖЕНА НЕСТАБИЛЬНОСТЬ"
            OVERALL_SUBTITLE="Stability run обнаружил failure или потенциальный flaky-сценарий"

          elif [[ "$STABILITY_RESULT" == "cancelled" ]]; then
            OVERALL_ICON="⏹️"
            OVERALL_TITLE="STABILITY CHECK ОТМЕНЁН"
            OVERALL_SUBTITLE="Выполнение stability-проверки было остановлено"

          else
            OVERALL_ICON="⚠️"
            OVERALL_TITLE="STABILITY CHECK НЕ ЗАВЕРШЁН"
            OVERALL_SUBTITLE="Проверка завершилась без полного результата"
          fi

          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          REPOSITORY_HTML="$(escape_html "$GITHUB_REPOSITORY")"
          BRANCH_HTML="$(escape_html "$BRANCH")"
          ACTOR_HTML="$(escape_html "$GITHUB_ACTOR")"
          EVENT_HTML="$(escape_html "$(event_label "$GITHUB_EVENT_NAME")")"

          SCENARIO_HTML="$(escape_html "$SCENARIO")"
          REPEAT_HTML="$(escape_html "$REPEAT_EACH")"
          WORKERS_HTML="$(escape_html "$WORKERS")"

          MESSAGE=$(cat <<EOF
          <b>PomidorQA • Playwright Stability Check</b>
          <i>Повторные E2E-прогоны без retries</i>

          ━━━━━━━━━━━━━━
          ${OVERALL_ICON} <b>${OVERALL_TITLE}</b>
          <i>${OVERALL_SUBTITLE}</i>
          ━━━━━━━━━━━━━━

          📦 <b>Репозиторий</b>
          <code>${REPOSITORY_HTML}</code>

          🌿 <b>Ветка</b>
          <code>${BRANCH_HTML}</code>

          ⚡ <b>Событие:</b> ${EVENT_HTML}
          👤 <b>Автор:</b> ${ACTOR_HTML}

          🔁 <b>Параметры stability-проверки</b>
          <blockquote>$(result_label "$STABILITY_RESULT")  Stability result
          🎯 Сценарий: ${SCENARIO_HTML}
          🔂 Повторений: ${REPEAT_HTML}
          ⚙️ Workers: ${WORKERS_HTML}
          ♻️ Retries: 0</blockquote>

          📊 <b>Reports:</b> Allure + Playwright HTML

          🔗 <a href="${RUN_URL}"><b>Открыть Stability run в GitHub Actions</b></a>
          <i>Запуск #${GITHUB_RUN_NUMBER}</i>
          EOF
          )

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --retry 2 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 20 \
              --output /tmp/telegram-response.json \
              --write-out '%{http_code}' \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              || true
          )"

          if [[ "$HTTP_CODE" != "200" ]] ||
             ! jq -e '.ok == true' /tmp/telegram-response.json >/dev/null 2>&1; then

            echo "::warning::Telegram не подтвердил доставку Stability notification (HTTP ${HTTP_CODE:-transport-error})."

            {
              echo "## ✈️ Telegram"
              echo
              echo "⚠️ Stability result сохранён, но Telegram не подтвердил доставку."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          {
            echo "## ✈️ Telegram"
            echo
            echo "✅ Stability result отправлен в Telegram."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Telegram stability notification sent."
