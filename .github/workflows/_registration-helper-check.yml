name: Temporary Registration Helper Check

on:
  push:
    branches:
      - test/registration-response-diagnostics
    paths:
      - tests/helpers/user.ts
      - .github/workflows/_registration-helper-check.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  registration-helper:
    name: Verify registration helper / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run targeted profile test
        run: >-
          npx playwright test --project=e2e tests/e2e/profile-flow.spec.ts
          --grep "имя сохраняется после перезагрузки"
          --workers=1 --retries=0
        env:
          CI: true
          E2E_BROWSER: chromium
