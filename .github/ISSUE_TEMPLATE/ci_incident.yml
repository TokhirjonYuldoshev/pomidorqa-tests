name: Сбой QA/CI
description: Зафиксировать сбой обязательной проверки, E2E, безопасности, нефункционального workflow, Nightly, платформы или уведомлений.
title: "[CI] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Начинайте с первой реально упавшей проверки. Сохраните диагностику и не перезапускайте до случайного зелёного результата, не увеличивайте таймауты и не добавляйте паузы/retries для сокрытия сбоя.

  - type: dropdown
    id: signal
    attributes:
      label: Первичный сигнал
      options:
        - Quality / lint + typecheck
        - Unit tests
        - API tests
        - E2E / Chromium
        - E2E / Firefox
        - E2E / WebKit
        - Security / npm audit
        - Security / dependency change review
        - Security / code quality
        - Accessibility Audit
        - Performance Smoke / Lighthouse
        - Visual Regression
        - Nightly E2E Regression
        - Registration Contract Smoke
        - GitHub Actions runner / platform
        - Только Telegram / уведомления
        - Не определено / нужен разбор
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Уровень серьёзности
      options:
        - SEV-1 — критичная подтверждённая регрессия основного пути на внешнем стенде
        - SEV-2 — обязательная проверка main сломана
        - SEV-3 — Nightly или нефункциональная регрессия при здоровом основном CI
        - SEV-4 — ошибка отчётности или уведомления без функциональной регрессии
    validations:
      required: true

  - type: input
    id: run
    attributes:
      label: Запуск GitHub Actions
      placeholder: https://github.com/.../actions/runs/...

  - type: input
    id: revision
    attributes:
      label: Commit / ветка
      placeholder: main @ abc1234
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Браузер / слой выполнения
      options:
        - Не применимо
        - Chromium
        - Firefox
        - WebKit
        - Несколько браузеров
        - Unit
        - API
        - Не определено
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Наблюдаемое поведение
      description: Укажите точный упавший шаг/assertion/status/locator или находку проверки безопасности/качества.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение / контракт
      description: Зафиксируйте инвариант, который должен выполняться.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Доказательства
      description: Укажите trace, screenshots, video, Playwright/Allure report, логи, сетевые данные или отчёт проверки. Не вставляйте секреты.
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Воспроизводимость
      options:
        - Постоянно
        - Периодически
        - Один случай
        - Не определено
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Влияние и область
      description: Какие пользовательские пути или уровни доверия затронуты и какие независимые сигналы остаются зелёными?
    validations:
      required: true

  - type: checkboxes
    id: discipline
    attributes:
      label: Дисциплина диагностики
      options:
        - label: Я начал с первой реально упавшей проверки, а не с итогового уведомления.
          required: true
        - label: Я сохранил исходный запуск и доступную диагностику.
          required: true
        - label: Я не использовал waitForTimeout, произвольные паузы, force, skip/only, увеличение retries или таймаутов как обходное решение.
          required: true
        - label: Если выполнялся повторный запуск внешнего E2E, он был целевым и основан на конкретном признаке восстановления окружения.
          required: true
        - label: В сообщении нет учётных данных, токенов и других секретов.
          required: true
