name: Отчёт о дефекте
description: Зафиксировать воспроизводимый дефект продукта, тестов или CI с достаточными доказательствами.
title: "[ДЕФЕКТ] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Отделяйте наблюдаемые факты от предположений. По возможности прикладывайте доказательства и не публикуйте секреты или персональные данные.

  - type: dropdown
    id: layer
    attributes:
      label: Затронутый слой
      description: Где наблюдается проблема?
      options:
        - Внешний продукт / E2E
        - Тестовый код / фреймворк
        - API / контракт
        - CI / GitHub Actions
        - Отчётность / уведомления
        - Безопасность / зависимости
        - Нефункциональная проверка
        - Не определено / нужен разбор
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Серьёзность
      description: Техническое и пользовательское влияние. Приоритет оценивается отдельно.
      options:
        - Blocker — блокирующий
        - Critical — критический
        - Major — существенный
        - Minor — ограниченный
        - Trivial — косметический
        - Не оценено
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      options:
        - P0 — немедленно
        - P1 — высокий
        - P2 — обычный
        - P3 — низкий
        - Не оценено
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: Браузер/движок, ОС, ветка/commit, workflow/run, URL и другой важный контекст.
      placeholder: |
        Браузер: WebKit / Playwright 1.x
        ОС: GitHub-hosted Ubuntu
        Commit: <sha>
        Run: <GitHub Actions URL>
    validations:
      required: true

  - type: textarea
    id: preconditions
    attributes:
      label: Предусловия и тестовые данные
      description: Укажите минимальное состояние, роль, аккаунт и уникальные данные. Не вставляйте секреты или рабочие учётные данные.

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Укажите самый короткий детерминированный путь воспроизведения.
      placeholder: |
        1. Открыть ...
        2. Выполнить ...
        3. Наблюдать ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
      description: Опишите наблюдаемое ожидаемое поведение или контракт.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
      description: Укажите только то, что наблюдалось. Предположения оставьте для раздела разбора.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Доказательства
      description: Приложите screenshot, trace/video, Allure/HTML report, HTTP-ответ или логи workflow. Секреты и персональные данные должны быть скрыты.

  - type: textarea
    id: triage
    attributes:
      label: Разбор / гипотеза
      description: Необязательная предполагаемая причина. Явно отделяйте гипотезу от подтверждённого факта.

  - type: checkboxes
    id: checks
    attributes:
      label: Проверка перед отправкой
      options:
        - label: Я проверил, что это не очевидный дубликат.
          required: true
        - label: Я не добавлял retries, произвольные паузы, force или ослабленные проверки для сокрытия проблемы.
          required: true
        - label: Я удалил или скрыл секреты, токены, учётные данные и персональную информацию.
          required: true
